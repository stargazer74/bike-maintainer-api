openapi: 3.0.3
info:
  title: Maintenance Service API
  description: >-
    API for managing vehicles, their maintenance tasks and maintenance logs.


    Authentication is session based: a successful `login` returns a session cookie (`JSESSIONID`,
    HttpOnly) that authenticates all further requests. New accounts must verify their email address
    (`register` → link by email → `verify-email`) before they can log in. Every vehicle belongs to exactly
    one user; vehicles of other users (and their tasks, logs and reports) are reported as 404.


    CSRF protection: the server sets an `XSRF-TOKEN` cookie; every state-changing request
    (POST/PUT/PATCH/DELETE) must echo its value in the `X-XSRF-TOKEN` header, otherwise it is
    rejected with 403.


    Operating modes: the service runs either as `portal` (default; public internet operation with the
    account-based authentication described above) or as `household` (private use in a trusted home
    network without passwords). The client asks `GET /api/v1/config` for the mode at startup. In
    `household` mode, people pick a profile (`/api/v1/profiles`) instead of logging in; selecting a
    profile starts the same kind of session as a login, so all other endpoints behave identically.
    Profile endpoints exist only in `household` mode (404 in `portal`); registration, email
    verification, login, password and admin endpoints exist only in `portal` mode (404 in
    `household`).


    Bot protection: endpoints that send emails to an address entered by the client (`register`,
    `verify-email/resend`, `password-reset/request`) require a solved ALTCHA proof-of-work challenge
    (`GET /api/v1/auth/challenge`, self-hosted, no third party) in the `altcha` field. All emails count
    towards a global daily limit; when it is reached these endpoints answer 429 with code
    `MAIL_QUOTA_EXCEEDED` for every email alike.
  version: 2.5.1
tags:
  - name: Auth
    description: >-
      Registration, login/logout and account management of the current user. In household mode only
      `me` and `logout` are available; all other Auth endpoints answer 404.
  - name: Admin
    description: User administration (requires role ADMIN; portal mode only)
  - name: Config
    description: Public configuration of the running service (e.g. operating mode)
  - name: Profiles
    description: Profile selection without password (household mode only)
  - name: Vehicles
  - name: MaintenanceTasks
  - name: MaintenanceLogs
security:
  - cookieAuth: [ ]
paths:
  /api/v1/vehicles:
    get:
      tags: [ Vehicles ]
      operationId: listVehicles
      summary: List all vehicles
      responses:
        '200':
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Vehicles ]
      operationId: createVehicle
      summary: Create a new vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ Vehicles ]
      operationId: getVehicle
      summary: Get a vehicle by id
      responses:
        '200':
          description: The vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [ Vehicles ]
      operationId: updateVehicle
      summary: Update a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [ Vehicles ]
      operationId: deleteVehicle
      summary: Delete a vehicle
      description: Deletes the vehicle together with all its maintenance tasks and maintenance logs.
      responses:
        '204':
          description: Vehicle deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-tasks:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceTasks ]
      operationId: listMaintenanceTasks
      summary: List maintenance tasks of a vehicle
      responses:
        '200':
          description: List of maintenance tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ MaintenanceTasks ]
      operationId: createMaintenanceTask
      summary: Create a maintenance task for a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceTaskRequest'
      responses:
        '201':
          description: Maintenance task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [ MaintenanceTasks ]
      operationId: getMaintenanceTask
      summary: Get a maintenance task by id
      responses:
        '200':
          description: The maintenance task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [ MaintenanceTasks ]
      operationId: updateMaintenanceTask
      summary: Update a maintenance task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceTaskRequest'
      responses:
        '200':
          description: Maintenance task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [ MaintenanceTasks ]
      operationId: deleteMaintenanceTask
      summary: Delete a maintenance task
      description: >-
        Only tasks that were never performed can be deleted; otherwise 409, so that the maintenance
        history stays complete. Such tasks can be deactivated instead (`active: false`).
      responses:
        '204':
          description: Maintenance task deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-logs:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceLogs ]
      operationId: listMaintenanceLogs
      summary: List maintenance logs of a vehicle
      responses:
        '200':
          description: List of maintenance logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceLogResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ MaintenanceLogs ]
      operationId: createMaintenanceLog
      summary: Create a maintenance log for a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceLogRequest'
      responses:
        '201':
          description: Maintenance log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-logs/{logId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/LogId'
    get:
      tags: [ MaintenanceLogs ]
      operationId: getMaintenanceLog
      summary: Get a maintenance log by id
      responses:
        '200':
          description: The maintenance log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceLogResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [ MaintenanceLogs ]
      operationId: updateMaintenanceLog
      summary: Update a maintenance log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceLogRequest'
      responses:
        '200':
          description: Maintenance log updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [ MaintenanceLogs ]
      operationId: deleteMaintenanceLog
      summary: Delete a maintenance log
      responses:
        '204':
          description: Maintenance log deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-report:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceLogs ]
      operationId: downloadMaintenanceReport
      summary: Download the maintenance report (history) of a vehicle as PDF
      description: >-
        Report of the performed maintenance of a vehicle: all entries, or only the ones selected via
        `logId`. The entries are always in chronological order, regardless of the order of the IDs.
        Texts are in the language of the vehicle owner.


        Every selected entry must belong to the vehicle; otherwise 400. Duplicate IDs are ignored. The
        file name in `Content-Disposition` is `maintenance-report-vehicle-{vehicleId}.pdf`, for a single
        entry `maintenance-report-vehicle-{vehicleId}-{performedAt}.pdf`.
      parameters:
        - name: logId
          in: query
          required: false
          description: IDs of the maintenance log entries to put in the report; without it, all entries
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 500
            items:
              type: integer
              format: int64
              minimum: 1
      responses:
        '200':
          description: Maintenance report as PDF file (file name in `Content-Disposition`)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-checklist:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceTasks ]
      operationId: downloadMaintenanceChecklist
      summary: Download a printable checklist of selected maintenance tasks as PDF
      description: >-
        Checklist to take to the workshop: vehicle, current mileage and date at the top, one line per
        selected task with a box to tick, its due status, last service and interval, and fields for
        date, mileage and notes at the bottom. The tasks are ordered by urgency (overdue first, then
        due soon, then the rest by remaining fraction), regardless of the order of the IDs. Texts are
        in the language of the vehicle owner.


        Every selected task must belong to the vehicle, be active and not be a one-time task that is
        already done; otherwise 400. Duplicate IDs are ignored.
      parameters:
        - name: taskId
          in: query
          required: true
          description: IDs of the tasks to put on the checklist
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: integer
              format: int64
              minimum: 1
      responses:
        '200':
          description: Checklist as PDF file (file name in `Content-Disposition`)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/challenge:
    get:
      tags: [ Auth ]
      operationId: getAuthChallenge
      summary: Get an ALTCHA proof-of-work challenge (portal mode only)
      description: >-
        Returns a signed ALTCHA challenge (protocol v2) for the ALTCHA widget. The client passes the
        response to the widget unchanged; the widget solves it in the browser and produces the
        base64 payload that `register`, `verify-email/resend` and `password-reset/request` expect in
        their `altcha` field. A challenge expires after a few minutes and its solution can be used
        only once. 404 in household mode.
      security: [ ]
      responses:
        '200':
          description: A new challenge
          headers:
            Cache-Control:
              description: Always `no-store` – every request needs a fresh challenge
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AltchaChallenge'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/register:
    post:
      tags: [ Auth ]
      operationId: register
      summary: Register a new user account (role USER)
      description: >-
        Always answers 202, regardless of whether the email is already registered, so that
        registered email addresses cannot be discovered. For a new email, an unverified account is
        created and a verification link (valid 24 hours) is sent; the user can log in only after
        verifying. For an already registered email, the owner receives a notice email instead and
        the existing account is left unchanged.


        Bot protection: `altcha` must contain a solved, unexpired and unused challenge, otherwise 400
        with code `CAPTCHA_INVALID`. If the honeypot field `website` is filled in, the service answers
        202 as usual but creates no account and sends no email. When the daily email limit is
        reached, the answer is 429 with code `MAIL_QUOTA_EXCEEDED`, regardless of the email.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration accepted; a verification or notice email is sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/verify-email:
    post:
      tags: [ Auth ]
      operationId: verifyEmail
      summary: Verify the email address of a new account using the token from the email
      description: The token can be used only once. Afterwards the user can log in.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email verified
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/verify-email/resend:
    post:
      tags: [ Auth ]
      operationId: resendVerificationEmail
      summary: Send the verification email again
      description: >-
        Always answers 204. A new link is sent only if an unverified account with this email
        exists; previously sent links become invalid. Requires a solved ALTCHA challenge in `altcha`
        (400 `CAPTCHA_INVALID` otherwise) and counts towards the daily email limit (429
        `MAIL_QUOTA_EXCEEDED`).
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '204':
          description: Request accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/login:
    post:
      tags: [ Auth ]
      operationId: login
      summary: Log in with email and password
      description: >-
        Wrong email and wrong password both answer 401 with the same message. After too many failed
        attempts for an account, further attempts are rejected with 429 for a while (same response
        as the per-IP rate limit, so that the existence of the account is not revealed).
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Credentials are correct, but the account cannot be used: `code` is `EMAIL_NOT_VERIFIED`
            (offer to resend the verification email) or `ACCOUNT_DISABLED` (deactivated by an admin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/logout:
    post:
      tags: [ Auth ]
      operationId: logout
      summary: Log out and invalidate the current session
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [ Auth ]
      operationId: getCurrentUser
      summary: Get the currently logged-in user
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [ Auth ]
      operationId: updateCurrentUser
      summary: Update settings of the currently logged-in user (e.g. preferred language)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password:
    put:
      tags: [ Auth ]
      operationId: changePassword
      summary: Change the password of the current user
      description: All other sessions of the user are invalidated; the current session stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password-reset/request:
    post:
      tags: [ Auth ]
      operationId: requestPasswordReset
      summary: Request a password reset link by email
      description: >-
        Always answers 204, regardless of whether an account with this email exists, so that
        registered email addresses cannot be discovered. If an active account exists, a reset link
        valid for one hour is sent by email. Requires a solved ALTCHA challenge in `altcha` (400
        `CAPTCHA_INVALID` otherwise) and counts towards the daily email limit (429
        `MAIL_QUOTA_EXCEEDED`).
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '204':
          description: Request accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [ Auth ]
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      description: >-
        The token can be used only once. All sessions of the user are invalidated. Since the reset
        link proves ownership of the email address, an unverified account becomes verified.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password reset
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/admin/users:
    get:
      tags: [ Admin ]
      operationId: listUsers
      summary: List all users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [ Admin ]
      operationId: updateUser
      summary: Change role and/or active state of a user
      description: >-
        Deactivating a user invalidates all of their sessions. The last active admin cannot be
        demoted or deactivated, and admins cannot deactivate themselves (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/config:
    get:
      tags: [ Config ]
      operationId: getAppConfig
      summary: Get the public configuration of the service (operating mode)
      description: >-
        Available in both modes without a session. The response also sets the `XSRF-TOKEN` cookie
        needed for subsequent state-changing requests.
      security: [ ]
      responses:
        '200':
          description: Configuration of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'

  /api/v1/profiles:
    get:
      tags: [ Profiles ]
      operationId: listProfiles
      summary: List all profiles (household mode only)
      description: Sorted by display name. Answers 404 in portal mode.
      security: [ ]
      responses:
        '200':
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ Profiles ]
      operationId: createProfile
      summary: Create a profile (household mode only)
      description: Answers 409 if the display name is already taken and 404 in portal mode.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    put:
      tags: [ Profiles ]
      operationId: updateProfile
      summary: Rename a profile (household mode only)
      description: Answers 409 if the display name is already taken by another profile.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Profile renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [ Profiles ]
      operationId: deleteProfile
      summary: Delete a profile (household mode only)
      description: >-
        Only profiles without vehicles can be deleted; otherwise 409, so that no data is lost
        unnoticed. Sessions of the deleted profile become invalid.
      security: [ ]
      responses:
        '204':
          description: Profile deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/profiles/{profileId}/select:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      tags: [ Profiles ]
      operationId: selectProfile
      summary: Use the app as this profile (household mode only)
      description: >-
        Starts a session for the profile, just like a login does: the session cookie is set and the
        session ID and CSRF token are renewed. An existing session of another profile is replaced.
      security: [ ]
      responses:
        '200':
          description: Profile selected; the session cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie set by login.

  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    LogId:
      name: logId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found (or owned by another user)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Not logged in, session expired or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Logged in but not permitted (e.g. missing role ADMIN or missing CSRF token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with the current state (e.g. name already taken, resource still in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: >-
        Rate limit exceeded: too many attempts from this IP address or on this account (no `code`),
        or the global daily email limit is reached (`code: MAIL_QUOTA_EXCEEDED`, independent of the
        email address).
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    VehicleType:
      type: string
      enum: [ MOTORCYCLE, CAR ]

    VehicleRequest:
      type: object
      required: [ name, type, modelYear, firstRegistrationDate, currentMileage ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/VehicleType'
        make:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 100
        modelYear:
          type: integer
          minimum: 1900
          maximum: 2100
        firstRegistrationDate:
          type: string
          format: date
          description: >-
            Date of first registration (Erstzulassung) — independent of modelYear, a vehicle's
            model year does not have to match when it was actually registered.
        currentMileage:
          type: integer
          minimum: 0

    VehicleResponse:
      type: object
      required: [ id, name, type, modelYear, firstRegistrationDate, currentMileage, createdAt, updatedAt ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        type:
          $ref: '#/components/schemas/VehicleType'
        make:
          type: string
        model:
          type: string
        modelYear:
          type: integer
        firstRegistrationDate:
          type: string
          format: date
        currentMileage:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    MaintenanceTaskRequest:
      type: object
      description: >-
        At least one of intervalKm or intervalMonths must be provided unless oneTime is true;
        this cross-field rule is enforced by the service, not by this schema.
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 1000
        intervalKm:
          type: integer
          minimum: 1
          description: Interval in kilometers (must be positive)
        intervalMonths:
          type: integer
          minimum: 1
          description: Interval in months (must be positive)
        firstDueKm:
          type: integer
          minimum: 0
          description: First due at this mileage
        firstDueMonths:
          type: integer
          minimum: 0
          description: First due after this many months
        oneTime:
          type: boolean
          default: false
        active:
          type: boolean
          default: true

    MaintenanceTaskStatus:
      type: string
      enum: [ OVERDUE, DUE_SOON, OK, DONE ]

    MaintenanceTaskResponse:
      type: object
      required: [ id, vehicleId, name, oneTime, active, status ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        vehicleId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        description:
          type: string
        intervalKm:
          type: integer
        intervalMonths:
          type: integer
        firstDueKm:
          type: integer
        firstDueMonths:
          type: integer
        oneTime:
          type: boolean
        active:
          type: boolean
        status:
          $ref: '#/components/schemas/MaintenanceTaskStatus'
          readOnly: true
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          readOnly: true
          description: Clamped elapsed fraction of whichever axis (km/time) is more urgent.
        remainingFraction:
          type: number
          format: double
          readOnly: true
          description: >-
            Signed remaining fraction of whichever interval is more urgent — negative once
            overdue. Unitless, comparable across tasks and across km/time axes for sorting.
        kmRemaining:
          type: integer
          readOnly: true
          description: >-
            Signed remaining kilometers; negative means overdue by that many km. Only set when
            the km axis is the one determining status/remainingFraction (null if the task has no
            km interval, or if its time axis is the more urgent one).
        daysRemaining:
          type: integer
          readOnly: true
          description: >-
            Signed remaining days; negative means overdue by that many days. Only set when the
            time axis is the one determining status/remainingFraction (null if the task has no
            time interval, or if its km axis is the more urgent one).
        lastServiceMileage:
          type: integer
          readOnly: true
        lastServiceDate:
          type: string
          format: date
          readOnly: true

    MaintenanceLogRequest:
      type: object
      required: [ performedAt, mileageAtPerformed ]
      properties:
        performedAt:
          type: string
          format: date
        mileageAtPerformed:
          type: integer
          minimum: 0
        notes:
          type: string
          minLength: 1
          maxLength: 1000
        performedTaskIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
        newTasks:
          type: array
          maxItems: 20
          description: >-
            Work that was no maintenance task before (e.g. a repair). Each entry is created as a task of the
            vehicle and booked as performed by this log, together with the log in one transaction: if anything
            is invalid, neither the log nor any task is saved (400). The IDs of the new tasks are returned in
            `performedTaskIds`.
          items:
            $ref: '#/components/schemas/NewMaintenanceTaskRequest'

    NewMaintenanceTaskRequest:
      type: object
      description: >-
        A task created while recording maintenance. Without intervalKm and intervalMonths it is a one-time
        task, done by this log; with an interval it recurs and this log counts as its first performance.
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 1000
        intervalKm:
          type: integer
          minimum: 1
          description: Interval in kilometers; makes the task recurring
        intervalMonths:
          type: integer
          minimum: 1
          description: Interval in months; makes the task recurring

    MaintenanceLogResponse:
      type: object
      required: [ id, vehicleId, performedAt, mileageAtPerformed, createdAt ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        vehicleId:
          type: integer
          format: int64
          readOnly: true
        performedAt:
          type: string
          format: date
        mileageAtPerformed:
          type: integer
        notes:
          type: string
        performedTaskIds:
          type: array
          items:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
          readOnly: true

    UserRole:
      type: string
      enum: [ USER, ADMIN ]

    Email:
      type: string
      format: email
      maxLength: 255
      description: Compared case-insensitively; stored trimmed and lower-cased.

    NewPassword:
      type: string
      minLength: 10
      maxLength: 72
      description: >-
        10 to 72 characters. 72 is the BCrypt limit; it applies to the UTF-8 byte length, which the
        service enforces additionally (umlauts count as 2 bytes).

    Language:
      type: string
      enum: [ de, en ]
      description: >-
        Preferred language of the user (ISO 639-1). Used for the UI after login and for emails and
        the PDF maintenance report.

    RegisterRequest:
      type: object
      required: [ email, password, altcha ]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/NewPassword'
        language:
          $ref: '#/components/schemas/Language'
          description: >-
            Language of the new account (the client sends its current UI language). If omitted,
            the service derives it from `Accept-Language`, falling back to `de`. The verification
            email is sent in this language.
        altcha:
          $ref: '#/components/schemas/AltchaPayload'
        website:
          type: string
          maxLength: 255
          description: >-
            Honeypot against bots. Clients render it invisible to humans and always send it empty
            (or omit it). If it contains anything, the request is accepted with 202 but ignored.

    UpdateCurrentUserRequest:
      type: object
      required: [ language ]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 72

    ChangePasswordRequest:
      type: object
      required: [ currentPassword, newPassword ]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
        newPassword:
          $ref: '#/components/schemas/NewPassword'

    EmailRequest:
      type: object
      required: [ email, altcha ]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        altcha:
          $ref: '#/components/schemas/AltchaPayload'

    TokenRequest:
      type: object
      required: [ token ]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: Token from the emailed link

    PasswordResetConfirmRequest:
      type: object
      required: [ token, newPassword ]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: Token from the reset link
        newPassword:
          $ref: '#/components/schemas/NewPassword'

    UpdateUserRequest:
      type: object
      description: At least one property must be set; enforced by the service.
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean

    UserResponse:
      type: object
      required: [ id, role, active, emailVerified, language, createdAt ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        email:
          type: string
          description: Missing for household profiles, which have no email address.
        displayName:
          type: string
          description: Name shown in the UI; set for household profiles.
        role:
          $ref: '#/components/schemas/UserRole'
        language:
          $ref: '#/components/schemas/Language'
        active:
          type: boolean
        emailVerified:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true

    OperatingMode:
      type: string
      enum: [ portal, household ]
      description: >-
        `portal`: public operation with accounts (email + password). `household`: private operation
        in a trusted network with profile selection and without passwords.

    AltchaChallenge:
      type: object
      additionalProperties: true
      description: >-
        ALTCHA challenge (protocol v2) as produced by the ALTCHA server library: `parameters`
        (algorithm, nonce, salt, cost, keyLength, keyPrefix, expiresAt, …) and an HMAC `signature`
        over them. Deliberately not modelled field by field: clients must pass it to the ALTCHA
        widget unchanged, because any re-serialisation (e.g. added null fields) breaks the
        signature.
      example:
        parameters:
          algorithm: PBKDF2/SHA-256
          nonce: 6f1a2b3c4d5e6f708192a3b4c5d6e7f8
          salt: 0a1b2c3d4e5f60718293a4b5c6d7e8f9
          cost: 5000
          keyLength: 32
          keyPrefix: '00'
          expiresAt: 1761660000
        signature: 3c9f0e…

    AltchaPayload:
      type: string
      minLength: 1
      maxLength: 4096
      description: >-
        Base64-encoded solution produced by the ALTCHA widget for a challenge from
        `GET /api/v1/auth/challenge`. Valid only once and only until the challenge expires.

    AppConfigResponse:
      type: object
      required: [ mode ]
      properties:
        mode:
          $ref: '#/components/schemas/OperatingMode'

    DisplayName:
      type: string
      minLength: 1
      maxLength: 50
      description: Stored trimmed; must not be blank and is unique (compared case-insensitively).

    ProfileRequest:
      type: object
      required: [ displayName ]
      properties:
        displayName:
          $ref: '#/components/schemas/DisplayName'

    ProfileResponse:
      type: object
      required: [ id, displayName ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        displayName:
          type: string

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        code:
          type: string
          description: >-
            Optional machine-readable error code for cases the client handles specifically:
            `EMAIL_NOT_VERIFIED`, `ACCOUNT_DISABLED` (403 on login), `CAPTCHA_INVALID` (400: the
            `altcha` solution is missing, invalid, expired or already used) and
            `MAIL_QUOTA_EXCEEDED` (429: the daily email limit is reached).
        message:
          type: string
          description: >-
            Technical description in English for logs and debugging. Clients show their own
            localized texts based on `status` and `code` instead of displaying this message.
        path:
          type: string
