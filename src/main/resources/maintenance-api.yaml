openapi: 3.0.3
info:
  title: Maintenance Service API
  description: >-
    API for managing vehicles, their maintenance tasks and maintenance logs.


    Authentication is session based: a successful `login` (or `register`) returns a session cookie
    (`JSESSIONID`, HttpOnly) that authenticates all further requests. Every vehicle belongs to exactly
    one user; vehicles of other users (and their tasks, logs and reports) are reported as 404.


    CSRF protection: the server sets an `XSRF-TOKEN` cookie; every state-changing request
    (POST/PUT/PATCH/DELETE) must echo its value in the `X-XSRF-TOKEN` header, otherwise it is
    rejected with 403.
  version: 2.0.0
tags:
  - name: Auth
    description: Registration, login/logout and account management of the current user
  - name: Admin
    description: User administration (requires role ADMIN)
  - name: Vehicles
  - name: MaintenanceTasks
  - name: MaintenanceLogs
security:
  - cookieAuth: [ ]
paths:
  /api/v1/vehicles:
    get:
      tags: [ Vehicles ]
      operationId: listVehicles
      summary: List all vehicles
      responses:
        '200':
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Vehicles ]
      operationId: createVehicle
      summary: Create a new vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ Vehicles ]
      operationId: getVehicle
      summary: Get a vehicle by id
      responses:
        '200':
          description: The vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [ Vehicles ]
      operationId: updateVehicle
      summary: Update a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [ Vehicles ]
      operationId: deleteVehicle
      summary: Delete a vehicle
      responses:
        '204':
          description: Vehicle deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-tasks:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceTasks ]
      operationId: listMaintenanceTasks
      summary: List maintenance tasks of a vehicle
      responses:
        '200':
          description: List of maintenance tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ MaintenanceTasks ]
      operationId: createMaintenanceTask
      summary: Create a maintenance task for a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceTaskRequest'
      responses:
        '201':
          description: Maintenance task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [ MaintenanceTasks ]
      operationId: getMaintenanceTask
      summary: Get a maintenance task by id
      responses:
        '200':
          description: The maintenance task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [ MaintenanceTasks ]
      operationId: updateMaintenanceTask
      summary: Update a maintenance task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceTaskRequest'
      responses:
        '200':
          description: Maintenance task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [ MaintenanceTasks ]
      operationId: deleteMaintenanceTask
      summary: Delete a maintenance task
      responses:
        '204':
          description: Maintenance task deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-logs:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceLogs ]
      operationId: listMaintenanceLogs
      summary: List maintenance logs of a vehicle
      responses:
        '200':
          description: List of maintenance logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceLogResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ MaintenanceLogs ]
      operationId: createMaintenanceLog
      summary: Create a maintenance log for a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceLogRequest'
      responses:
        '201':
          description: Maintenance log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-logs/{logId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/LogId'
    get:
      tags: [ MaintenanceLogs ]
      operationId: getMaintenanceLog
      summary: Get a maintenance log by id
      responses:
        '200':
          description: The maintenance log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceLogResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [ MaintenanceLogs ]
      operationId: updateMaintenanceLog
      summary: Update a maintenance log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceLogRequest'
      responses:
        '200':
          description: Maintenance log updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [ MaintenanceLogs ]
      operationId: deleteMaintenanceLog
      summary: Delete a maintenance log
      responses:
        '204':
          description: Maintenance log deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-report:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceLogs ]
      operationId: downloadMaintenanceReport
      summary: Download the maintenance report (history) of a vehicle as PDF
      responses:
        '200':
          description: Maintenance report as PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/register:
    post:
      tags: [ Auth ]
      operationId: register
      summary: Register a new user account (role USER) and log it in
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered and logged in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/login:
    post:
      tags: [ Auth ]
      operationId: login
      summary: Log in with email and password
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/logout:
    post:
      tags: [ Auth ]
      operationId: logout
      summary: Log out and invalidate the current session
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [ Auth ]
      operationId: getCurrentUser
      summary: Get the currently logged-in user
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password:
    put:
      tags: [ Auth ]
      operationId: changePassword
      summary: Change the password of the current user
      description: All other sessions of the user are invalidated; the current session stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password-reset/request:
    post:
      tags: [ Auth ]
      operationId: requestPasswordReset
      summary: Request a password reset link by email
      description: >-
        Always answers 204, regardless of whether an account with this email exists, so that
        registered email addresses cannot be discovered. If an active account exists, a reset link
        valid for one hour is sent by email.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Request accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [ Auth ]
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      description: The token can be used only once. All sessions of the user are invalidated.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password reset
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/admin/users:
    get:
      tags: [ Admin ]
      operationId: listUsers
      summary: List all users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [ Admin ]
      operationId: updateUser
      summary: Change role and/or active state of a user
      description: >-
        Deactivating a user invalidates all of their sessions. The last active admin cannot be
        demoted or deactivated, and admins cannot deactivate themselves (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie set by login/register.

  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    LogId:
      name: logId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found (or owned by another user)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Not logged in, session expired or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Logged in but not permitted (e.g. missing role ADMIN or missing CSRF token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict with the current state (e.g. email already registered)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    VehicleType:
      type: string
      enum: [ MOTORCYCLE, CAR ]

    VehicleRequest:
      type: object
      required: [ name, type, modelYear, firstRegistrationDate, currentMileage ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/VehicleType'
        make:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 100
        modelYear:
          type: integer
          minimum: 1900
          maximum: 2100
        firstRegistrationDate:
          type: string
          format: date
          description: >-
            Date of first registration (Erstzulassung) — independent of modelYear, a vehicle's
            model year does not have to match when it was actually registered.
        currentMileage:
          type: integer
          minimum: 0

    VehicleResponse:
      type: object
      required: [ id, name, type, modelYear, firstRegistrationDate, currentMileage, createdAt, updatedAt ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        type:
          $ref: '#/components/schemas/VehicleType'
        make:
          type: string
        model:
          type: string
        modelYear:
          type: integer
        firstRegistrationDate:
          type: string
          format: date
        currentMileage:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    MaintenanceTaskRequest:
      type: object
      description: >-
        At least one of intervalKm or intervalMonths must be provided unless oneTime is true;
        this cross-field rule is enforced by the service, not by this schema.
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 1000
        intervalKm:
          type: integer
          minimum: 1
          description: Interval in kilometers (must be positive)
        intervalMonths:
          type: integer
          minimum: 1
          description: Interval in months (must be positive)
        firstDueKm:
          type: integer
          minimum: 0
          description: First due at this mileage
        firstDueMonths:
          type: integer
          minimum: 0
          description: First due after this many months
        oneTime:
          type: boolean
          default: false
        active:
          type: boolean
          default: true

    MaintenanceTaskStatus:
      type: string
      enum: [ OVERDUE, DUE_SOON, OK, DONE ]

    MaintenanceTaskResponse:
      type: object
      required: [ id, vehicleId, name, oneTime, active, status ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        vehicleId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        description:
          type: string
        intervalKm:
          type: integer
        intervalMonths:
          type: integer
        firstDueKm:
          type: integer
        firstDueMonths:
          type: integer
        oneTime:
          type: boolean
        active:
          type: boolean
        status:
          $ref: '#/components/schemas/MaintenanceTaskStatus'
          readOnly: true
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          readOnly: true
          description: Clamped elapsed fraction of whichever axis (km/time) is more urgent.
        remainingFraction:
          type: number
          format: double
          readOnly: true
          description: >-
            Signed remaining fraction of whichever interval is more urgent — negative once
            overdue. Unitless, comparable across tasks and across km/time axes for sorting.
        kmRemaining:
          type: integer
          readOnly: true
          description: >-
            Signed remaining kilometers; negative means overdue by that many km. Only set when
            the km axis is the one determining status/remainingFraction (null if the task has no
            km interval, or if its time axis is the more urgent one).
        daysRemaining:
          type: integer
          readOnly: true
          description: >-
            Signed remaining days; negative means overdue by that many days. Only set when the
            time axis is the one determining status/remainingFraction (null if the task has no
            time interval, or if its km axis is the more urgent one).
        lastServiceMileage:
          type: integer
          readOnly: true
        lastServiceDate:
          type: string
          format: date
          readOnly: true

    MaintenanceLogRequest:
      type: object
      required: [ performedAt, mileageAtPerformed ]
      properties:
        performedAt:
          type: string
          format: date
        mileageAtPerformed:
          type: integer
          minimum: 0
        notes:
          type: string
          minLength: 1
          maxLength: 1000
        performedTaskIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1

    MaintenanceLogResponse:
      type: object
      required: [ id, vehicleId, performedAt, mileageAtPerformed, createdAt ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        vehicleId:
          type: integer
          format: int64
          readOnly: true
        performedAt:
          type: string
          format: date
        mileageAtPerformed:
          type: integer
        notes:
          type: string
        performedTaskIds:
          type: array
          items:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
          readOnly: true

    UserRole:
      type: string
      enum: [ USER, ADMIN ]

    Email:
      type: string
      format: email
      maxLength: 255
      description: Compared case-insensitively; stored trimmed and lower-cased.

    NewPassword:
      type: string
      minLength: 10
      maxLength: 72
      description: >-
        10 to 72 characters. 72 is the BCrypt limit; it applies to the UTF-8 byte length, which the
        service enforces additionally (umlauts count as 2 bytes).

    RegisterRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/NewPassword'

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 72

    ChangePasswordRequest:
      type: object
      required: [ currentPassword, newPassword ]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
        newPassword:
          $ref: '#/components/schemas/NewPassword'

    PasswordResetRequest:
      type: object
      required: [ email ]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    PasswordResetConfirmRequest:
      type: object
      required: [ token, newPassword ]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: Token from the reset link
        newPassword:
          $ref: '#/components/schemas/NewPassword'

    UpdateUserRequest:
      type: object
      description: At least one property must be set; enforced by the service.
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean

    UserResponse:
      type: object
      required: [ id, email, role, active, createdAt ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        email:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
