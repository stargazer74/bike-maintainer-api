openapi: 3.0.3
info:
  title: Maintenance Service API
  description: >-
    API for managing vehicles, their maintenance tasks and maintenance logs.


    Authentication is session based: a successful `login` returns a session cookie (`JSESSIONID`,
    HttpOnly) that authenticates all further requests. New accounts must verify their email address
    (`register` → link by email → `verify-email`) before they can log in. Every vehicle belongs to exactly
    one user; vehicles of other users (and their tasks, logs and reports) are reported as 404.


    CSRF protection: the server sets an `XSRF-TOKEN` cookie; every state-changing request
    (POST/PUT/PATCH/DELETE) must echo its value in the `X-XSRF-TOKEN` header, otherwise it is
    rejected with 403.


    Operating modes: the service runs either as `portal` (default; public internet operation with the
    account-based authentication described above) or as `household` (private use in a trusted home
    network without passwords). The client asks `GET /api/v1/config` for the mode at startup. In
    `household` mode, people pick a profile (`/api/v1/profiles`) instead of logging in; selecting a
    profile starts the same kind of session as a login, so all other endpoints behave identically.
    Profile endpoints exist only in `household` mode (404 in `portal`); registration, email
    verification, login, password and admin endpoints exist only in `portal` mode (404 in
    `household`).


    Bot protection: endpoints that send emails to an address entered by the client (`register`,
    `verify-email/resend`, `password-reset/request`) require a solved ALTCHA proof-of-work challenge
    (`GET /api/v1/auth/challenge`, self-hosted, no third party) in the `altcha` field. All emails count
    towards a global daily limit; when it is reached these endpoints answer 429 with code
    `MAIL_QUOTA_EXCEEDED` for every email alike.
  version: 2.15.0
tags:
  - name: Auth
    description: >-
      Registration, login/logout and account management of the current user. In household mode only
      `GET`/`PATCH me` and `logout` are available; all other Auth endpoints (including `DELETE me` and the
      device endpoints) answer 404.
  - name: Admin
    description: User administration (requires role ADMIN; portal mode only)
  - name: Config
    description: Public configuration of the running service (e.g. operating mode)
  - name: Profiles
    description: Profile selection without password (household mode only)
  - name: Vehicles
  - name: VehicleExport
    description: >-
      Move a vehicle with its maintenance plan, history, measured values and target values to another
      instance (e.g. from the portal to an own instance in household mode, or back). A file holds exactly
      one vehicle; it contains no database IDs, no timestamps of the database and nothing about accounts or
      profiles. Importing always creates a new vehicle owned by the current user or profile.
  - name: MaintenanceTasks
  - name: MaintenanceLogs
  - name: Measurements
    description: >-
      Target values of a vehicle (from the workshop manual), measured values of a maintenance log, and the
      shim calculator for the valve clearance. Lengths are in mm (at most 3 decimal places), pressures in bar
      (at most 2 decimal places).
  - name: Worksheets
    description: >-
      Printable worksheets for measuring and adjustment work (e.g. valve clearance). A worksheet is an
      empty form with a prefilled vehicle header; nothing is stored.
security:
  - cookieAuth: [ ]
paths:
  /api/v1/vehicles:
    get:
      tags: [ Vehicles ]
      operationId: listVehicles
      summary: List all vehicles
      responses:
        '200':
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Vehicles ]
      operationId: createVehicle
      summary: Create a new vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ Vehicles ]
      operationId: getVehicle
      summary: Get a vehicle by id
      responses:
        '200':
          description: The vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [ Vehicles ]
      operationId: updateVehicle
      summary: Update a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [ Vehicles ]
      operationId: deleteVehicle
      summary: Delete a vehicle
      description: Deletes the vehicle together with all its maintenance tasks and maintenance logs.
      responses:
        '204':
          description: Vehicle deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/export:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ VehicleExport ]
      operationId: exportVehicle
      summary: Export a vehicle as file
      description: >-
        The vehicle with its target values, all maintenance tasks (also inactive ones) and all maintenance
        logs with materials and measured values, in the format `VehicleExport`. Sent as download: the file
        name in `Content-Disposition` names the vehicle and the export date (e.g.
        `vehicle-red-one-2026-11-11.json`). An unknown vehicle or one of another user is answered with 404.
      responses:
        '200':
          description: Export file (file name in `Content-Disposition`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleExport'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/import:
    post:
      tags: [ VehicleExport ]
      operationId: importVehicle
      summary: Create a vehicle from an export file
      description: >-
        The content of an export file is sent as JSON body (the client reads the file, e.g. to show a
        preview first). Always creates a new vehicle owned by the current user or profile – nothing is
        overwritten or merged, a vehicle with the same name may exist. Tasks, logs, materials, measured
        values and target values are created with new IDs; the currency of each log is taken from the file.
        All or nothing: if anything is invalid, nothing is created.


        400 with `code: IMPORT_INVALID` and `details` (one entry per problem, e.g.
        `vehicle.maintenanceLogs[3].mileageAtPerformed: must be greater than or equal to 0`) if the file
        breaks a rule of this schema or of the normal requests (e.g. a log refers to an unknown task `ref`,
        a task without interval that is not one-time). 400 with `code: IMPORT_FORMAT_UNSUPPORTED` if
        `formatVersion` is unknown (a newer instance wrote the file). Files larger than 5 MB are answered
        with 413.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleExport'
      responses:
        '201':
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-tasks:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceTasks ]
      operationId: listMaintenanceTasks
      summary: List maintenance tasks of a vehicle
      responses:
        '200':
          description: List of maintenance tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ MaintenanceTasks ]
      operationId: createMaintenanceTask
      summary: Create a maintenance task for a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceTaskRequest'
      responses:
        '201':
          description: Maintenance task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [ MaintenanceTasks ]
      operationId: getMaintenanceTask
      summary: Get a maintenance task by id
      responses:
        '200':
          description: The maintenance task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [ MaintenanceTasks ]
      operationId: updateMaintenanceTask
      summary: Update a maintenance task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceTaskRequest'
      responses:
        '200':
          description: Maintenance task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [ MaintenanceTasks ]
      operationId: deleteMaintenanceTask
      summary: Delete a maintenance task
      description: >-
        Only tasks that were never performed can be deleted; otherwise 409, so that the maintenance
        history stays complete. Such tasks can be deactivated instead (`active: false`).
      responses:
        '204':
          description: Maintenance task deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-logs:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceLogs ]
      operationId: listMaintenanceLogs
      summary: List maintenance logs of a vehicle
      responses:
        '200':
          description: List of maintenance logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceLogResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ MaintenanceLogs ]
      operationId: createMaintenanceLog
      summary: Create a maintenance log for a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceLogRequest'
      responses:
        '201':
          description: Maintenance log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-logs/{logId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
      - $ref: '#/components/parameters/LogId'
    get:
      tags: [ MaintenanceLogs ]
      operationId: getMaintenanceLog
      summary: Get a maintenance log by id
      responses:
        '200':
          description: The maintenance log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceLogResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [ MaintenanceLogs ]
      operationId: updateMaintenanceLog
      summary: Update a maintenance log
      description: >-
        Replaces the log. Further work it created (`createdByLogId`) that is no longer in `performedTaskIds` is
        deleted, unless another log contains it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceLogRequest'
      responses:
        '200':
          description: Maintenance log updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceLogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [ MaintenanceLogs ]
      operationId: deleteMaintenanceLog
      summary: Delete a maintenance log
      description: >-
        Deletes the log together with the further work it created (`createdByLogId`), unless another log contains
        that task. Planned tasks stay; they become due again.
      responses:
        '204':
          description: Maintenance log deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/cost-summary:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceLogs ]
      operationId: getCostSummary
      summary: Get the maintenance costs of a vehicle per currency
      description: >-
        Sums up `totalCost` of all maintenance logs of the vehicle, separately per currency that occurs.
        Logs without a `totalCost` are not counted. `currentYear` only covers logs performed in the current
        calendar year. Empty if the vehicle has no costs.
      responses:
        '200':
          description: One entry per occurring currency
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CostSummaryEntry'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-report:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceLogs ]
      operationId: downloadMaintenanceReport
      summary: Download the maintenance report (history) of a vehicle as PDF
      description: >-
        Report of the performed maintenance of a vehicle: all entries, or only the ones selected via
        `logId`. The entries are always in chronological order, regardless of the order of the IDs.
        Texts are in the language of the vehicle owner.


        Every selected entry must belong to the vehicle; otherwise 400. Duplicate IDs are ignored. The
        file name in `Content-Disposition` is `maintenance-report-vehicle-{vehicleId}.pdf`, for a single
        entry `maintenance-report-vehicle-{vehicleId}-{performedAt}.pdf`.
      parameters:
        - name: logId
          in: query
          required: false
          description: IDs of the maintenance log entries to put in the report; without it, all entries
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 500
            items:
              type: integer
              format: int64
              minimum: 1
      responses:
        '200':
          description: Maintenance report as PDF file (file name in `Content-Disposition`)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/maintenance-checklist:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ MaintenanceTasks ]
      operationId: downloadMaintenanceChecklist
      summary: Download a printable checklist of selected maintenance tasks as PDF
      description: >-
        Checklist to take to the workshop: vehicle, current mileage and date at the top, one line per
        selected task with a box to tick, its due status, last service and interval, and fields for
        date, mileage and notes at the bottom. The tasks are ordered by urgency (overdue first, then
        due soon, then the rest by remaining fraction), regardless of the order of the IDs. Texts are
        in the language of the vehicle owner.


        Every selected task must belong to the vehicle, be active and not be a one-time task that is
        already done; otherwise 400. Duplicate IDs are ignored.
      parameters:
        - name: taskId
          in: query
          required: true
          description: IDs of the tasks to put on the checklist
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: integer
              format: int64
              minimum: 1
      responses:
        '200':
          description: Checklist as PDF file (file name in `Content-Disposition`)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/specifications:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ Measurements ]
      operationId: getVehicleSpecifications
      summary: Target values and engine data of a vehicle
      description: All fields are optional; a vehicle without stored values returns an empty object.
      responses:
        '200':
          description: Target values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleSpecifications'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [ Measurements ]
      operationId: updateVehicleSpecifications
      summary: Replace the target values and engine data of a vehicle
      description: >-
        Replaces all values; a field that is left out is no longer stored. A minimum must not be greater
        than its maximum (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleSpecifications'
      responses:
        '200':
          description: Stored target values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleSpecifications'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/measurements/latest:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ Measurements ]
      operationId: getLatestMeasurements
      summary: The most recent measurement of every template
      description: >-
        For each template the measurement of the latest maintenance log that has one (by `performedAt`,
        then by log ID), with the log it comes from. Used to show previous values next to the input fields
        and to prefill the old shims with the new shims of last time. Templates that were never measured
        are left out.
      responses:
        '200':
          description: Latest measurements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestMeasurementsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/shim-calculation:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    post:
      tags: [ Measurements ]
      operationId: calculateShims
      summary: Suggest new shims for measured valve clearances
      description: >-
        Stateless, nothing is stored. Target range, shim step and available sizes come from the target
        values of the vehicle. Per valve: target = middle of the target range of its kind (intake/exhaust),
        ideal shim = old shim + (measured − target). The suggestion is the size on the grid of the shim
        step (multiples of `shimStep`) whose resulting clearance (measured + old shim − new shim) lies in
        the target range and is closest to the middle; on a tie the thicker shim (tighter clearance) wins.


        `hint`: `NO_CHANGE_NEEDED` – the measured clearance is already in range, the suggestion is the old
        shim; `NO_SHIM_IN_RANGE` – no grid size gives a clearance in range (step too coarse), the size
        closest to the ideal is suggested; `OUTSIDE_AVAILABLE_SIZES` – the suggestion is smaller than
        `shimMin` or greater than `shimMax`; `MISSING_INPUT` – measured value, old shim, target range or
        shim step is missing, no suggestion; `NOT_SHIM_ADJUSTED` – the engine is adjusted by screw
        (`valveAdjustment` = SCREW), no suggestion. Results are in the order of the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShimCalculationRequest'
      responses:
        '200':
          description: One result per valve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShimCalculationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/worksheets:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [ Worksheets ]
      operationId: listWorksheetTemplates
      summary: List the worksheet templates available for a vehicle
      description: >-
        The templates that fit the vehicle type, in a fixed order (VALVE_CLEARANCE, BRAKES, CHAIN,
        TIRES). Valve clearance is offered for MOTORCYCLE, CAR, QUAD and SCOOTER; chain for MOTORCYCLE,
        BICYCLE, E_BIKE and QUAD; brakes and tires for every type.
      responses:
        '200':
          description: Available templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorksheetTemplateResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/vehicles/{vehicleId}/worksheets/{template}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
      - name: template
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/WorksheetTemplate'
    get:
      tags: [ Worksheets ]
      operationId: downloadWorksheet
      summary: Download an empty worksheet for a vehicle as PDF
      description: >-
        Empty worksheet to fill in by hand: vehicle, make/model, model year, current mileage and print
        date at the top, the measuring fields of the template, and fields for date, mileage, "done by"
        and notes at the bottom. Texts are in the language of the vehicle owner. Nothing is stored.


        `cylinders` and `valvesPerCylinder` are required for VALVE_CLEARANCE and not allowed for the
        other templates (400). A template that is not available for the vehicle type is answered with
        400. The file name in `Content-Disposition` names the template, the vehicle and the print date in
        the language of the vehicle owner (e.g. `worksheet-valve-clearance-red-one-2026-11-10.pdf`).
      parameters:
        - name: cylinders
          in: query
          required: false
          description: Number of cylinders (VALVE_CLEARANCE only)
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 8
        - name: valvesPerCylinder
          in: query
          required: false
          description: Number of valves per cylinder (VALVE_CLEARANCE only)
          schema:
            type: integer
            format: int32
            minimum: 2
            maximum: 4
      responses:
        '200':
          description: Worksheet as PDF file (file name in `Content-Disposition`)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/challenge:
    get:
      tags: [ Auth ]
      operationId: getAuthChallenge
      summary: Get an ALTCHA proof-of-work challenge (portal mode only)
      description: >-
        Returns a signed ALTCHA challenge (protocol v2) for the ALTCHA widget. The client passes the
        response to the widget unchanged; the widget solves it in the browser and produces the
        base64 payload that `register`, `verify-email/resend` and `password-reset/request` expect in
        their `altcha` field. A challenge expires after a few minutes and its solution can be used
        only once. 404 in household mode.
      security: [ ]
      responses:
        '200':
          description: A new challenge
          headers:
            Cache-Control:
              description: Always `no-store` – every request needs a fresh challenge
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AltchaChallenge'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/register:
    post:
      tags: [ Auth ]
      operationId: register
      summary: Register a new user account (role USER)
      description: >-
        Always answers 202, regardless of whether the email is already registered, so that
        registered email addresses cannot be discovered. For a new email, an unverified account is
        created and a verification link (valid 24 hours) is sent; the user can log in only after
        verifying. For an already registered email, the owner receives a notice email instead and
        the existing account is left unchanged.


        Bot protection: `altcha` must contain a solved, unexpired and unused challenge, otherwise 400
        with code `CAPTCHA_INVALID`. If the honeypot field `website` is filled in, the service answers
        202 as usual but creates no account and sends no email. When the daily email limit is
        reached, the answer is 429 with code `MAIL_QUOTA_EXCEEDED`, regardless of the email.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration accepted; a verification or notice email is sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/verify-email:
    post:
      tags: [ Auth ]
      operationId: verifyEmail
      summary: Verify the email address of a new account using the token from the email
      description: The token can be used only once. Afterwards the user can log in.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email verified
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/verify-email/resend:
    post:
      tags: [ Auth ]
      operationId: resendVerificationEmail
      summary: Send the verification email again
      description: >-
        Always answers 204. A new link is sent only if an unverified account with this email
        exists; previously sent links become invalid. Requires a solved ALTCHA challenge in `altcha`
        (400 `CAPTCHA_INVALID` otherwise) and counts towards the daily email limit (429
        `MAIL_QUOTA_EXCEEDED`).
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '204':
          description: Request accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/login:
    post:
      tags: [ Auth ]
      operationId: login
      summary: Log in with email and password
      description: >-
        Wrong email and wrong password both answer 401 with the same message. After too many failed
        attempts for an account, further attempts are rejected with 429 for a while (same response
        as the per-IP rate limit, so that the existence of the account is not revealed).
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Credentials are correct, but the account cannot be used: `code` is `EMAIL_NOT_VERIFIED`
            (offer to resend the verification email) or `ACCOUNT_DISABLED` (deactivated by an admin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/logout:
    post:
      tags: [ Auth ]
      operationId: logout
      summary: Log out and invalidate the current session
      description: >-
        If the session was started with a device token (`device-login` or `device-session`), that device is
        removed as well, so the app has to log in again.
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [ Auth ]
      operationId: getCurrentUser
      summary: Get the currently logged-in user
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [ Auth ]
      operationId: updateCurrentUser
      summary: Update settings of the currently logged-in user (preferred language and/or currency; at least one)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [ Auth ]
      operationId: deleteCurrentUser
      summary: Permanently delete the account of the current user (portal mode only)
      description: >-
        Deletes the account together with all of its vehicles, maintenance tasks, maintenance logs and
        costs, its open verification and reset tokens and all of its sessions (including the current
        one). There is no undo. The current password confirms the deletion; a wrong password counts
        as a failed login attempt (rate limit and account lockout, 429). The last active admin cannot
        delete their own account (409). Answers 404 in household mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Account deleted; the session cookie is no longer valid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The password is wrong (`code` is `WRONG_PASSWORD`) or the CSRF token is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The user is the last active admin (`code` is `LAST_ADMIN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/password:
    put:
      tags: [ Auth ]
      operationId: changePassword
      summary: Change the password of the current user
      description: All other sessions of the user are invalidated; the current session stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password-reset/request:
    post:
      tags: [ Auth ]
      operationId: requestPasswordReset
      summary: Request a password reset link by email
      description: >-
        Always answers 204, regardless of whether an account with this email exists, so that
        registered email addresses cannot be discovered. If an active account exists, a reset link
        valid for one hour is sent by email. Requires a solved ALTCHA challenge in `altcha` (400
        `CAPTCHA_INVALID` otherwise) and counts towards the daily email limit (429
        `MAIL_QUOTA_EXCEEDED`).
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '204':
          description: Request accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [ Auth ]
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      description: >-
        The token can be used only once. All sessions of the user are invalidated. Since the reset
        link proves ownership of the email address, an unverified account becomes verified.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password reset
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/device-login:
    post:
      tags: [ Auth ]
      operationId: deviceLogin
      summary: Log in from an app and keep this device logged in (portal mode only)
      description: >-
        Same checks and errors as `login` (rate limit, account lockout, `EMAIL_NOT_VERIFIED`,
        `ACCOUNT_DISABLED`). Additionally registers the device and returns a device token. When the session
        expires, the app exchanges the token for a new session via `device-session`. A device stays registered
        until it is not used for 90 days, the user logs out from it, removes it, changes or resets the password,
        or deletes the account. A device can only be registered with email and password, never from an
        existing session. Answers 404 in household mode.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLoginRequest'
      responses:
        '200':
          description: Logged in; the session cookie is set and the device token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Credentials are correct, but the account cannot be used: `code` is `EMAIL_NOT_VERIFIED` or
            `ACCOUNT_DISABLED` (as for `login`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/device-session:
    post:
      tags: [ Auth ]
      operationId: createDeviceSession
      summary: Start a new session with a device token (portal mode only)
      description: >-
        Exchanges the device token for a new session and returns a new device token; the old one becomes
        invalid. Presenting an already exchanged token again removes the device and ends the sessions started
        with it (the token was probably copied) – except within 60 seconds of the exchange, when it is only
        rejected. Clients exchange one token at a time; after a 401 they re-read the stored token and retry once
        if it changed in the meantime. Every rejection – unknown, expired, removed or reused token, deactivated
        or unverified account – answers the same 401. Answers 404 in household mode.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSessionRequest'
      responses:
        '200':
          description: New session started; the session cookie is set and a new device token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/devices:
    get:
      tags: [ Auth ]
      operationId: listDevices
      summary: List the devices that stay logged in for the current user (portal mode only)
      responses:
        '200':
          description: Devices, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    delete:
      tags: [ Auth ]
      operationId: deleteDevice
      summary: Log out a device of the current user (portal mode only)
      description: >-
        Removes the device and ends the sessions started with it. Devices of other users are reported as 404.
      responses:
        '204':
          description: Device removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/users:
    get:
      tags: [ Admin ]
      operationId: listUsers
      summary: List all users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [ Admin ]
      operationId: updateUser
      summary: Change role and/or active state of a user
      description: >-
        Deactivating a user invalidates all of their sessions. The last active admin cannot be
        demoted or deactivated, and admins cannot deactivate themselves (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/config:
    get:
      tags: [ Config ]
      operationId: getAppConfig
      summary: Get the public configuration of the service (operating mode, website address)
      description: >-
        Available in both modes without a session. The response also sets the `XSRF-TOKEN` cookie
        needed for subsequent state-changing requests.
      security: [ ]
      responses:
        '200':
          description: Configuration of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'

  /api/v1/profiles:
    get:
      tags: [ Profiles ]
      operationId: listProfiles
      summary: List all profiles (household mode only)
      description: Sorted by display name. Answers 404 in portal mode.
      security: [ ]
      responses:
        '200':
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ Profiles ]
      operationId: createProfile
      summary: Create a profile (household mode only)
      description: Answers 409 if the display name is already taken and 404 in portal mode.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    put:
      tags: [ Profiles ]
      operationId: updateProfile
      summary: Rename a profile (household mode only)
      description: Answers 409 if the display name is already taken by another profile.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Profile renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [ Profiles ]
      operationId: deleteProfile
      summary: Delete a profile (household mode only)
      description: >-
        Only profiles without vehicles can be deleted; otherwise 409, so that no data is lost
        unnoticed. Sessions of the deleted profile become invalid.
      security: [ ]
      responses:
        '204':
          description: Profile deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/profiles/{profileId}/select:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      tags: [ Profiles ]
      operationId: selectProfile
      summary: Use the app as this profile (household mode only)
      description: >-
        Starts a session for the profile, just like a login does: the session cookie is set and the
        session ID and CSRF token are renewed. An existing session of another profile is replaced.
      security: [ ]
      responses:
        '200':
          description: Profile selected; the session cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie set by login.

  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    LogId:
      name: logId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found (or owned by another user)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Not logged in, session expired or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Logged in but not permitted (e.g. missing role ADMIN or missing CSRF token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with the current state (e.g. name already taken, resource still in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request body too large (e.g. an import file over 5 MB)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: >-
        Rate limit exceeded: too many attempts from this IP address or on this account (no `code`),
        or the global daily email limit is reached (`code: MAIL_QUOTA_EXCEEDED`, independent of the
        email address).
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    VehicleType:
      type: string
      enum: [ MOTORCYCLE, CAR, BICYCLE, E_BIKE, QUAD, SCOOTER ]

    VehicleRequest:
      type: object
      required: [ name, type, modelYear, firstRegistrationDate, currentMileage ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/VehicleType'
        make:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 100
        modelYear:
          type: integer
          minimum: 1900
          maximum: 2100
        firstRegistrationDate:
          type: string
          format: date
          description: >-
            Date of first registration (Erstzulassung) — independent of modelYear, a vehicle's
            model year does not have to match when it was actually registered.
        currentMileage:
          type: integer
          minimum: 0

    VehicleResponse:
      type: object
      required: [ id, name, type, modelYear, firstRegistrationDate, currentMileage, createdAt, updatedAt ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        type:
          $ref: '#/components/schemas/VehicleType'
        make:
          type: string
        model:
          type: string
        modelYear:
          type: integer
        firstRegistrationDate:
          type: string
          format: date
        currentMileage:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    MaintenanceTaskRequest:
      type: object
      description: >-
        At least one of intervalKm or intervalMonths must be provided unless oneTime is true;
        this cross-field rule is enforced by the service, not by this schema.
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 1000
        intervalKm:
          type: integer
          minimum: 1
          description: Interval in kilometers (must be positive)
        intervalMonths:
          type: integer
          minimum: 1
          description: Interval in months (must be positive)
        firstDueKm:
          type: integer
          minimum: 0
          description: First due at this mileage
        firstDueMonths:
          type: integer
          minimum: 0
          description: First due after this many months
        oneTime:
          type: boolean
          default: false
        active:
          type: boolean
          default: true

    MaintenanceTaskStatus:
      type: string
      enum: [ OVERDUE, DUE_SOON, OK, DONE ]

    MaintenanceTaskResponse:
      type: object
      required: [ id, vehicleId, name, oneTime, active, status ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        vehicleId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        description:
          type: string
        intervalKm:
          type: integer
        intervalMonths:
          type: integer
        firstDueKm:
          type: integer
        firstDueMonths:
          type: integer
        oneTime:
          type: boolean
        active:
          type: boolean
        createdByLogId:
          type: integer
          format: int64
          readOnly: true
          description: >-
            Set for further work: the maintenance log whose `newTasks` created this one-time task. Deleting that
            log, or removing the task from it, deletes the task too unless another log contains it. Not set for
            planned tasks.
        status:
          $ref: '#/components/schemas/MaintenanceTaskStatus'
          readOnly: true
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          readOnly: true
          description: Clamped elapsed fraction of whichever axis (km/time) is more urgent.
        remainingFraction:
          type: number
          format: double
          readOnly: true
          description: >-
            Signed remaining fraction of whichever interval is more urgent — negative once
            overdue. Unitless, comparable across tasks and across km/time axes for sorting.
        kmRemaining:
          type: integer
          readOnly: true
          description: >-
            Signed remaining kilometers; negative means overdue by that many km. Only set when
            the km axis is the one determining status/remainingFraction (null if the task has no
            km interval, or if its time axis is the more urgent one).
        daysRemaining:
          type: integer
          readOnly: true
          description: >-
            Signed remaining days; negative means overdue by that many days. Only set when the
            time axis is the one determining status/remainingFraction (null if the task has no
            time interval, or if its km axis is the more urgent one).
        lastServiceMileage:
          type: integer
          readOnly: true
        lastServiceDate:
          type: string
          format: date
          readOnly: true

    MaintenanceLogRequest:
      type: object
      required: [ performedAt, mileageAtPerformed ]
      properties:
        performedAt:
          type: string
          format: date
        mileageAtPerformed:
          type: integer
          minimum: 0
        notes:
          type: string
          minLength: 1
          maxLength: 1000
        performedTaskIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
        newTasks:
          type: array
          maxItems: 20
          description: >-
            Work that was no maintenance task before (e.g. a repair). Each entry is created as a task of the
            vehicle and booked as performed by this log, together with the log in one transaction: if anything
            is invalid, neither the log nor any task is saved (400). The IDs of the new tasks are returned in
            `performedTaskIds`.
          items:
            $ref: '#/components/schemas/NewMaintenanceTaskRequest'
        materials:
          type: array
          maxItems: 50
          description: >-
            Materials used (parts, oil, ...). When updating, this list replaces the previous one. A material's
            `taskId` must be contained in `performedTaskIds` (400 otherwise).
          items:
            $ref: '#/components/schemas/MaintenanceMaterialRequest'
        laborCost:
          type: number
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
          description: Labor cost in the currency of the log (at most 2 decimal places)
        measurements:
          $ref: '#/components/schemas/MaintenanceMeasurementsRequest'

    MaterialUnit:
      type: string
      enum: [ PIECE, LITER, MILLILITER, KILOGRAM, GRAM, METER ]

    Currency:
      type: string
      enum: [ EUR, CHF, GBP, USD, SEK, NOK, DKK, PLN, CZK ]
      description: ISO 4217 currency code. New users start with `EUR`.

    MaintenanceMaterialRequest:
      type: object
      required: [ name, quantity, unit ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        partNumber:
          type: string
          maxLength: 100
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 999999.999
          multipleOf: 0.001
          description: Amount in `unit` (greater than 0, at most 3 decimal places)
        unit:
          $ref: '#/components/schemas/MaterialUnit'
        price:
          type: number
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
          description: Total price of this material line in the currency of the log, not a unit price (at most 2 decimal places)
        taskId:
          type: integer
          format: int64
          minimum: 1
          description: Optional performed task this material belongs to; must be contained in `performedTaskIds`

    MaintenanceMaterialResponse:
      type: object
      required: [ name, quantity, unit ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        partNumber:
          type: string
          maxLength: 100
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 999999.999
          multipleOf: 0.001
          description: Amount in `unit`
        unit:
          $ref: '#/components/schemas/MaterialUnit'
        price:
          type: number
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
          description: Total price of this material line in the currency of the log, not a unit price
        taskId:
          type: integer
          format: int64
          minimum: 1
          description: Performed task this material belongs to, if any

    CostSummaryEntry:
      type: object
      required: [ currency, total, currentYear ]
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        total:
          type: number
          multipleOf: 0.01
          description: Sum of all log costs in this currency
        currentYear:
          type: number
          multipleOf: 0.01
          description: Sum of the log costs in this currency for logs performed in the current calendar year

    NewMaintenanceTaskRequest:
      type: object
      description: >-
        A task created while recording maintenance. Without intervalKm and intervalMonths it is a one-time
        task, done by this log; with an interval it recurs and this log counts as its first performance.
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 1000
        intervalKm:
          type: integer
          minimum: 1
          description: Interval in kilometers; makes the task recurring
        intervalMonths:
          type: integer
          minimum: 1
          description: Interval in months; makes the task recurring

    MaintenanceLogResponse:
      type: object
      required: [ id, vehicleId, performedAt, mileageAtPerformed, currency, materials, createdAt ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        vehicleId:
          type: integer
          format: int64
          readOnly: true
        performedAt:
          type: string
          format: date
        mileageAtPerformed:
          type: integer
        notes:
          type: string
        performedTaskIds:
          type: array
          items:
            type: integer
            format: int64
        materials:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceMaterialResponse'
        laborCost:
          type: number
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
          description: Labor cost in the currency of the log
        currency:
          $ref: '#/components/schemas/Currency'
          readOnly: true
          description: Currency of all amounts of this log; taken from the user's currency when the log is created.
        totalCost:
          type: number
          multipleOf: 0.01
          readOnly: true
          description: >-
            Sum of the material prices (each the total of its line) and the labor cost.
            Missing if the log has neither prices nor labor cost.
        measurements:
          $ref: '#/components/schemas/MaintenanceMeasurementsResponse'
        createdAt:
          type: string
          format: date-time
          readOnly: true

    UserRole:
      type: string
      enum: [ USER, ADMIN ]

    Email:
      type: string
      format: email
      maxLength: 255
      description: Compared case-insensitively; stored trimmed and lower-cased.

    NewPassword:
      type: string
      minLength: 10
      maxLength: 72
      description: >-
        10 to 72 characters. 72 is the BCrypt limit; it applies to the UTF-8 byte length, which the
        service enforces additionally (umlauts count as 2 bytes).

    Language:
      type: string
      enum: [ de, en ]
      description: >-
        Preferred language of the user (ISO 639-1). Used for the UI after login and for emails and
        the PDF maintenance report.

    RegisterRequest:
      type: object
      required: [ email, password, altcha ]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/NewPassword'
        language:
          $ref: '#/components/schemas/Language'
          description: >-
            Language of the new account (the client sends its current UI language). If omitted,
            the service derives it from `Accept-Language`, falling back to `de`. The verification
            email is sent in this language.
        altcha:
          $ref: '#/components/schemas/AltchaPayload'
        website:
          type: string
          maxLength: 255
          description: >-
            Honeypot against bots. Clients render it invisible to humans and always send it empty
            (or omit it). If it contains anything, the request is accepted with 202 but ignored.

    UpdateCurrentUserRequest:
      type: object
      minProperties: 1
      properties:
        language:
          $ref: '#/components/schemas/Language'
        currency:
          $ref: '#/components/schemas/Currency'

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 72

    ChangePasswordRequest:
      type: object
      required: [ currentPassword, newPassword ]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
        newPassword:
          $ref: '#/components/schemas/NewPassword'

    DeviceLoginRequest:
      type: object
      required: [ email, password, deviceName ]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 72
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
          description: Name shown in the device list, e.g. the model of the phone

    DeviceSessionRequest:
      type: object
      required: [ deviceToken ]
      properties:
        deviceToken:
          type: string
          minLength: 43
          maxLength: 43

    DeviceLoginResponse:
      type: object
      required: [ user, deviceToken ]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        deviceToken:
          type: string
          description: >-
            Secret of this device (256 random bits, Base64url without padding). Store it securely; it is
            shown only in this response.

    DeviceResponse:
      type: object
      required: [ id, name, createdAt, lastUsedAt, current ]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the device that started the requesting session

    DeleteAccountRequest:
      type: object
      required: [ password ]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 72
          description: Current password of the user, confirms the deletion

    EmailRequest:
      type: object
      required: [ email, altcha ]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        altcha:
          $ref: '#/components/schemas/AltchaPayload'

    TokenRequest:
      type: object
      required: [ token ]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: Token from the emailed link

    PasswordResetConfirmRequest:
      type: object
      required: [ token, newPassword ]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
          description: Token from the reset link
        newPassword:
          $ref: '#/components/schemas/NewPassword'

    UpdateUserRequest:
      type: object
      description: At least one property must be set; enforced by the service.
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean

    UserResponse:
      type: object
      required: [ id, role, active, emailVerified, language, currency, createdAt ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        email:
          type: string
          description: Missing for household profiles, which have no email address.
        displayName:
          type: string
          description: Name shown in the UI; set for household profiles.
        role:
          $ref: '#/components/schemas/UserRole'
        language:
          $ref: '#/components/schemas/Language'
        currency:
          $ref: '#/components/schemas/Currency'
        active:
          type: boolean
        emailVerified:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true

    OperatingMode:
      type: string
      enum: [ portal, household ]
      description: >-
        `portal`: public operation with accounts (email + password). `household`: private operation
        in a trusted network with profile selection and without passwords.

    AltchaChallenge:
      type: object
      additionalProperties: true
      description: >-
        ALTCHA challenge (protocol v2) as produced by the ALTCHA server library: `parameters`
        (algorithm, nonce, salt, cost, keyLength, keyPrefix, expiresAt, …) and an HMAC `signature`
        over them. Deliberately not modelled field by field: clients must pass it to the ALTCHA
        widget unchanged, because any re-serialisation (e.g. added null fields) breaks the
        signature.
      example:
        parameters:
          algorithm: PBKDF2/SHA-256
          nonce: 6f1a2b3c4d5e6f708192a3b4c5d6e7f8
          salt: 0a1b2c3d4e5f60718293a4b5c6d7e8f9
          cost: 5000
          keyLength: 32
          keyPrefix: '00'
          expiresAt: 1761660000
        signature: 3c9f0e…

    AltchaPayload:
      type: string
      minLength: 1
      maxLength: 4096
      description: >-
        Base64-encoded solution produced by the ALTCHA widget for a challenge from
        `GET /api/v1/auth/challenge`. Valid only once and only until the challenge expires.

    AppConfigResponse:
      type: object
      required: [ mode ]
      properties:
        mode:
          $ref: '#/components/schemas/OperatingMode'
        websiteUrl:
          type: string
          format: uri
          example: https://www.example.com
          description: >-
            Address of the public website (landing page, legal notice, privacy policy), without a
            trailing slash. Only set in portal mode and only if the operator configured it, otherwise
            missing or null; clients show no links to the website without it.

    DisplayName:
      type: string
      minLength: 1
      maxLength: 50
      description: Stored trimmed; must not be blank and is unique (compared case-insensitively).

    ProfileRequest:
      type: object
      required: [ displayName ]
      properties:
        displayName:
          $ref: '#/components/schemas/DisplayName'

    ProfileResponse:
      type: object
      required: [ id, displayName, vehicleCount ]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        displayName:
          type: string
        vehicleCount:
          type: integer
          minimum: 0
          readOnly: true
          description: >-
            Vehicles of the profile. A profile with vehicles cannot be deleted (409), so the client can explain
            that before asking.

    ValveAdjustment:
      type: string
      description: How the valve clearance is set – with shims (bucket) or with an adjusting screw.
      enum: [ SHIM, SCREW ]

    ValveKind:
      type: string
      enum: [ INTAKE, EXHAUST ]

    MeasurementStatus:
      type: string
      description: >-
        Measured value against the current target values of the vehicle (computed when read, not stored):
        `OK`, `OUT_OF_RANGE`, or `UNKNOWN` if no value was measured or no target value is stored.
      enum: [ OK, OUT_OF_RANGE, UNKNOWN ]

    VehicleSpecifications:
      type: object
      description: Target values from the workshop manual; all optional. Lengths in mm, pressures in bar.
      properties:
        cylinders:
          type: integer
          format: int32
          minimum: 1
          maximum: 8
        valvesPerCylinder:
          type: integer
          format: int32
          minimum: 2
          maximum: 4
        valveAdjustment:
          $ref: '#/components/schemas/ValveAdjustment'
        intakeClearanceMin:
          type: number
          minimum: 0
          maximum: 9.999
          multipleOf: 0.001
          description: Valve clearance intake, lower limit
        intakeClearanceMax:
          type: number
          minimum: 0
          maximum: 9.999
          multipleOf: 0.001
          description: Valve clearance intake, upper limit
        exhaustClearanceMin:
          type: number
          minimum: 0
          maximum: 9.999
          multipleOf: 0.001
          description: Valve clearance exhaust, lower limit
        exhaustClearanceMax:
          type: number
          minimum: 0
          maximum: 9.999
          multipleOf: 0.001
          description: Valve clearance exhaust, upper limit
        shimStep:
          type: number
          minimum: 0.001
          maximum: 1
          multipleOf: 0.001
          description: Step between the available shim sizes, e.g. 0.025 or 0.05
        shimMin:
          type: number
          minimum: 0
          maximum: 99.999
          multipleOf: 0.001
          description: Smallest available shim
        shimMax:
          type: number
          minimum: 0
          maximum: 99.999
          multipleOf: 0.001
          description: Largest available shim
        brakePadMinFront:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Minimum brake pad thickness front
        brakePadMinRear:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Minimum brake pad thickness rear
        brakeDiscMinFront:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Minimum brake disc thickness front
        brakeDiscMinRear:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Minimum brake disc thickness rear
        chainSlackMin:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Chain slack, lower limit
        chainSlackMax:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Chain slack, upper limit
        chainWearLinks:
          type: integer
          format: int32
          minimum: 2
          maximum: 200
          description: Number of links the wear length is measured over
        chainWearMaxLength:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: 'Wear limit: maximum length over `chainWearLinks` links'
        tirePressureFront:
          type: number
          minimum: 0
          maximum: 10
          multipleOf: 0.01
          description: Target tyre pressure front
        tirePressureRear:
          type: number
          minimum: 0
          maximum: 10
          multipleOf: 0.01
          description: Target tyre pressure rear
        treadDepthMin:
          type: number
          minimum: 0
          maximum: 99.999
          multipleOf: 0.001
          description: Minimum tread depth

    MaintenanceMeasurementsRequest:
      type: object
      description: >-
        Measured values of a maintenance log, at most one set per template. When updating a log, a given
        object replaces all measurements of the log (a template that is left out is deleted); if
        `measurements` is left out entirely, the stored measurements stay unchanged.
      properties:
        valveClearance:
          $ref: '#/components/schemas/ValveClearanceMeasurementRequest'
        brakes:
          $ref: '#/components/schemas/BrakeMeasurementRequest'
        chain:
          $ref: '#/components/schemas/ChainMeasurementRequest'
        tires:
          $ref: '#/components/schemas/TireMeasurementRequest'

    MaintenanceMeasurementsResponse:
      type: object
      description: Measured values of a maintenance log; templates without a measurement are left out.
      properties:
        valveClearance:
          $ref: '#/components/schemas/ValveClearanceMeasurementResponse'
        brakes:
          $ref: '#/components/schemas/BrakeMeasurementResponse'
        chain:
          $ref: '#/components/schemas/ChainMeasurementResponse'
        tires:
          $ref: '#/components/schemas/TireMeasurementResponse'

    ValveClearanceMeasurementRequest:
      type: object
      required: [ valves ]
      properties:
        valves:
          type: array
          minItems: 1
          maxItems: 32
          description: One entry per valve; each combination of cylinder, kind and index only once (400).
          items:
            $ref: '#/components/schemas/ValveMeasurementRequest'

    ValveMeasurementRequest:
      type: object
      required: [ cylinder, valve, index ]
      properties:
        cylinder:
          type: integer
          format: int32
          minimum: 1
          maximum: 8
        valve:
          $ref: '#/components/schemas/ValveKind'
        index:
          type: integer
          format: int32
          minimum: 1
          maximum: 2
          description: Number of the valve of this kind in the cylinder (1, or 1–2 with two of a kind)
        measured:
          type: number
          minimum: 0
          maximum: 9.999
          multipleOf: 0.001
          description: Measured clearance
        shimOld:
          type: number
          minimum: 0
          maximum: 99.999
          multipleOf: 0.001
          description: Shim installed before
        shimNew:
          type: number
          minimum: 0
          maximum: 99.999
          multipleOf: 0.001
          description: Shim installed now (left out if not changed)

    ValveClearanceMeasurementResponse:
      type: object
      required: [ valves ]
      properties:
        valves:
          type: array
          description: Ordered by cylinder, then intake before exhaust, then index.
          items:
            $ref: '#/components/schemas/ValveMeasurementResponse'

    ValveMeasurementResponse:
      type: object
      required: [ cylinder, valve, index, measuredStatus ]
      properties:
        cylinder:
          type: integer
          format: int32
        valve:
          $ref: '#/components/schemas/ValveKind'
        index:
          type: integer
          format: int32
        measured:
          type: number
        shimOld:
          type: number
        shimNew:
          type: number
        measuredStatus:
          allOf:
            - $ref: '#/components/schemas/MeasurementStatus'
          readOnly: true
          description: Measured clearance against the target range of the valve kind

    BrakeMeasurementRequest:
      type: object
      properties:
        padFront:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Brake pad thickness front
        padRear:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Brake pad thickness rear
        discFront:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Brake disc thickness front
        discRear:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Brake disc thickness rear
        discConditionFront:
          type: string
          minLength: 1
          maxLength: 100
          description: Condition of the front disc (free text)
        discConditionRear:
          type: string
          minLength: 1
          maxLength: 100
          description: Condition of the rear disc (free text)
        fluidCondition:
          type: string
          minLength: 1
          maxLength: 100
          description: Brake fluid level, colour or age (free text)

    BrakeMeasurementResponse:
      type: object
      required: [ padFrontStatus, padRearStatus, discFrontStatus, discRearStatus ]
      properties:
        padFront:
          type: number
        padRear:
          type: number
        discFront:
          type: number
        discRear:
          type: number
        discConditionFront:
          type: string
        discConditionRear:
          type: string
        fluidCondition:
          type: string
        padFrontStatus:
          allOf:
            - $ref: '#/components/schemas/MeasurementStatus'
          readOnly: true
          description: Against `brakePadMinFront`
        padRearStatus:
          allOf:
            - $ref: '#/components/schemas/MeasurementStatus'
          readOnly: true
          description: Against `brakePadMinRear`
        discFrontStatus:
          allOf:
            - $ref: '#/components/schemas/MeasurementStatus'
          readOnly: true
          description: Against `brakeDiscMinFront`
        discRearStatus:
          allOf:
            - $ref: '#/components/schemas/MeasurementStatus'
          readOnly: true
          description: Against `brakeDiscMinRear`

    ChainMeasurementRequest:
      type: object
      properties:
        slack:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Chain slack
        wearLength:
          type: number
          minimum: 0
          maximum: 999.999
          multipleOf: 0.001
          description: Measured length over `wearLinks` links
        wearLinks:
          type: integer
          format: int32
          minimum: 2
          maximum: 200
        sprocketCondition:
          type: string
          minLength: 1
          maxLength: 100
          description: Condition of the front sprocket (free text)
        rearSprocketCondition:
          type: string
          minLength: 1
          maxLength: 100
          description: Condition of the rear sprocket (free text)
        cleaned:
          type: boolean
        lubricated:
          type: boolean

    ChainMeasurementResponse:
      type: object
      required: [ slackStatus, wearLengthStatus ]
      properties:
        slack:
          type: number
        wearLength:
          type: number
        wearLinks:
          type: integer
          format: int32
        sprocketCondition:
          type: string
        rearSprocketCondition:
          type: string
        cleaned:
          type: boolean
        lubricated:
          type: boolean
        slackStatus:
          allOf:
            - $ref: '#/components/schemas/MeasurementStatus'
          readOnly: true
          description: Against `chainSlackMin`–`chainSlackMax`
        wearLengthStatus:
          allOf:
            - $ref: '#/components/schemas/MeasurementStatus'
          readOnly: true
          description: Against `chainWearMaxLength`; UNKNOWN if `wearLinks` differs from `chainWearLinks`

    TireMeasurementRequest:
      type: object
      properties:
        pressureFront:
          type: number
          minimum: 0
          maximum: 10
          multipleOf: 0.01
          description: Tyre pressure front
        pressureRear:
          type: number
          minimum: 0
          maximum: 10
          multipleOf: 0.01
          description: Tyre pressure rear
        treadFront:
          type: number
          minimum: 0
          maximum: 99.999
          multipleOf: 0.001
          description: Tread depth front
        treadRear:
          type: number
          minimum: 0
          maximum: 99.999
          multipleOf: 0.001
          description: Tread depth rear
        dotFront:
          type: string
          pattern: '^[0-9]{4}$'
          description: DOT date code front (week and year, WWYY)
        dotRear:
          type: string
          pattern: '^[0-9]{4}$'
          description: DOT date code rear (week and year, WWYY)
        conditionFront:
          type: string
          minLength: 1
          maxLength: 100
          description: Condition of the front tyre (free text, e.g. cracks, foreign objects)
        conditionRear:
          type: string
          minLength: 1
          maxLength: 100
          description: Condition of the rear tyre (free text)

    TireMeasurementResponse:
      type: object
      required: [ pressureFrontStatus, pressureRearStatus, treadFrontStatus, treadRearStatus ]
      properties:
        pressureFront:
          type: number
        pressureRear:
          type: number
        treadFront:
          type: number
        treadRear:
          type: number
        dotFront:
          type: string
        dotRear:
          type: string
        conditionFront:
          type: string
        conditionRear:
          type: string
        pressureFrontStatus:
          allOf:
            - $ref: '#/components/schemas/MeasurementStatus'
          readOnly: true
          description: Against `tirePressureFront`; OK within ±0.1 bar
        pressureRearStatus:
          allOf:
            - $ref: '#/components/schemas/MeasurementStatus'
          readOnly: true
          description: Against `tirePressureRear`; OK within ±0.1 bar
        treadFrontStatus:
          allOf:
            - $ref: '#/components/schemas/MeasurementStatus'
          readOnly: true
          description: Against `treadDepthMin`
        treadRearStatus:
          allOf:
            - $ref: '#/components/schemas/MeasurementStatus'
          readOnly: true
          description: Against `treadDepthMin`

    MeasurementSource:
      type: object
      required: [ logId, performedAt, mileageAtPerformed ]
      properties:
        logId:
          type: integer
          format: int64
        performedAt:
          type: string
          format: date
        mileageAtPerformed:
          type: integer

    LatestMeasurementsResponse:
      type: object
      required: [ measurements, sources ]
      properties:
        measurements:
          $ref: '#/components/schemas/MaintenanceMeasurementsResponse'
        sources:
          type: object
          description: The maintenance log each measurement comes from, with the same keys as `measurements`.
          properties:
            valveClearance:
              $ref: '#/components/schemas/MeasurementSource'
            brakes:
              $ref: '#/components/schemas/MeasurementSource'
            chain:
              $ref: '#/components/schemas/MeasurementSource'
            tires:
              $ref: '#/components/schemas/MeasurementSource'

    ShimCalculationRequest:
      type: object
      required: [ valves ]
      properties:
        valves:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/ShimCalculationInput'

    ShimCalculationInput:
      type: object
      required: [ valve ]
      properties:
        valve:
          $ref: '#/components/schemas/ValveKind'
        measured:
          type: number
          minimum: 0
          maximum: 9.999
          multipleOf: 0.001
          description: Measured clearance
        shimOld:
          type: number
          minimum: 0
          maximum: 99.999
          multipleOf: 0.001
          description: Shim installed before

    ShimHint:
      type: string
      enum: [ NO_CHANGE_NEEDED, NO_SHIM_IN_RANGE, OUTSIDE_AVAILABLE_SIZES, MISSING_INPUT, NOT_SHIM_ADJUSTED ]

    ShimCalculationResponse:
      type: object
      required: [ results ]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ShimCalculationResult'

    ShimCalculationResult:
      type: object
      properties:
        suggestedShim:
          type: number
          description: Suggested new shim; missing with MISSING_INPUT and NOT_SHIM_ADJUSTED
        resultingClearance:
          type: number
          description: Clearance with the suggested shim (measured + old shim − suggested shim)
        hint:
          $ref: '#/components/schemas/ShimHint'

    WorksheetTemplate:
      type: string
      enum: [ VALVE_CLEARANCE, BRAKES, CHAIN, TIRES ]

    WorksheetTemplateResponse:
      type: object
      required: [ template ]
      properties:
        template:
          $ref: '#/components/schemas/WorksheetTemplate'

    VehicleExport:
      type: object
      description: >-
        Export file of one vehicle. Contains no database IDs: tasks have a key `ref` that is only valid
        inside the file, logs and materials refer to tasks by it. The limits below also apply to the import.
      required: [ formatVersion, exportedAt, vehicle ]
      properties:
        formatVersion:
          type: integer
          format: int32
          minimum: 1
          description: Version of this file format; currently 1. Raised on incompatible changes.
        exportedAt:
          type: string
          format: date-time
        appVersion:
          type: string
          maxLength: 50
          description: Version of the instance that wrote the file (informational)
        vehicle:
          $ref: '#/components/schemas/ExportedVehicle'

    ExportedVehicle:
      type: object
      description: Master data as in `VehicleRequest`, plus target values, tasks and logs.
      required: [ name, type, modelYear, firstRegistrationDate, currentMileage ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: '#/components/schemas/VehicleType'
        make:
          type: string
          minLength: 1
          maxLength: 100
        model:
          type: string
          minLength: 1
          maxLength: 100
        modelYear:
          type: integer
          minimum: 1900
          maximum: 2100
        firstRegistrationDate:
          type: string
          format: date
        currentMileage:
          type: integer
          minimum: 0
        specifications:
          $ref: '#/components/schemas/VehicleSpecifications'
        maintenanceTasks:
          type: array
          maxItems: 200
          description: All tasks, also inactive ones; each `ref` only once.
          items:
            $ref: '#/components/schemas/ExportedMaintenanceTask'
        maintenanceLogs:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/ExportedMaintenanceLog'

    ExportedMaintenanceTask:
      type: object
      description: >-
        A task as in `MaintenanceTaskRequest`, plus its key `ref`. At least one of intervalKm or
        intervalMonths unless oneTime is true.
      required: [ ref, name ]
      properties:
        ref:
          type: string
          minLength: 1
          maxLength: 40
          description: Key of the task inside the file (e.g. `t1`), unique within the vehicle
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          maxLength: 1000
        intervalKm:
          type: integer
          minimum: 1
        intervalMonths:
          type: integer
          minimum: 1
        firstDueKm:
          type: integer
          minimum: 0
        firstDueMonths:
          type: integer
          minimum: 0
        oneTime:
          type: boolean
          default: false
        active:
          type: boolean
          default: true

    ExportedMaintenanceLog:
      type: object
      description: >-
        A log as in `MaintenanceLogRequest`, with tasks referred to by `ref` and the currency of its costs.
        A material's `taskRef` must be contained in `performedTaskRefs`.
      required: [ performedAt, mileageAtPerformed, currency ]
      properties:
        performedAt:
          type: string
          format: date
        mileageAtPerformed:
          type: integer
          minimum: 0
        notes:
          type: string
          minLength: 1
          maxLength: 1000
        performedTaskRefs:
          type: array
          uniqueItems: true
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 40
        createdTaskRefs:
          type: array
          uniqueItems: true
          maxItems: 200
          description: >-
            The one-time tasks this log created as further work (`createdByLogId`); each must be contained in
            `performedTaskRefs` and may be created by one log only.
          items:
            type: string
            minLength: 1
            maxLength: 40
        currency:
          $ref: '#/components/schemas/Currency'
        laborCost:
          type: number
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
          description: Labor cost in `currency`
        materials:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ExportedMaintenanceMaterial'
        measurements:
          $ref: '#/components/schemas/MaintenanceMeasurementsRequest'

    ExportedMaintenanceMaterial:
      type: object
      description: A material as in `MaintenanceMaterialRequest`, with the task referred to by `ref`.
      required: [ name, quantity, unit ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        partNumber:
          type: string
          maxLength: 100
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 999999.999
          multipleOf: 0.001
        unit:
          $ref: '#/components/schemas/MaterialUnit'
        price:
          type: number
          minimum: 0
          maximum: 99999.99
          multipleOf: 0.01
          description: Total price of this material line in the currency of the log
        taskRef:
          type: string
          minLength: 1
          maxLength: 40
          description: Optional performed task this material belongs to

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        code:
          type: string
          description: >-
            Optional machine-readable error code for cases the client handles specifically:
            `EMAIL_NOT_VERIFIED`, `ACCOUNT_DISABLED` (403 on login), `CAPTCHA_INVALID` (400: the
            `altcha` solution is missing, invalid, expired or already used) and
            `MAIL_QUOTA_EXCEEDED` (429: the daily email limit is reached), `WRONG_PASSWORD` (403 on
            account deletion), `LAST_ADMIN` (409 on account deletion), `IMPORT_INVALID` (400: the
            import file breaks a rule, see `details`) and `IMPORT_FORMAT_UNSUPPORTED` (400: unknown
            `formatVersion` of an import file).
        message:
          type: string
          description: >-
            Technical description in English for logs and debugging. Clients show their own
            localized texts based on `status` and `code` instead of displaying this message.
        path:
          type: string
        details:
          type: array
          maxItems: 100
          description: >-
            Optional list of single problems, each as `<location>: <problem>` in English (e.g. for
            `IMPORT_INVALID`). Clients may show it as technical detail next to their own text.
          items:
            type: string
